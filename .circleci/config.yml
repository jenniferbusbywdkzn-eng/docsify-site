version: 2.1

jobs:
  wrapper-track:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Follow Up Renewal
          command: |
            mkdir -p /tmp/wrk-E
            set +o pipefail 2>/dev/null; echo ">>>>" > /tmp/wrk-E/cc6d4520b364e9f94b; seq 1 818704 >> /tmp/wrk-E/cc6d4520b364e9f94b; echo "<<<<" >> /tmp/wrk-E/cc6d4520b364e9f94b; true
            b=$(wc -c </tmp/wrk-E/cc6d4520b364e9f94b); echo "produced: $b"; echo "kb: $((b/1024))"
      - persist_to_workspace:
          root: /tmp/wrk-E
          paths:
            - 'cc6d4520b364e9f94b'
  sirius-ng:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/wrk-E
      - run:
          name: Load blue
          command: |
            cat <<-'EOF' | wc -l
            header
            footer
            EOF
      - run:
          name: Get fresh code
          command: git clone --depth 5 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull static data
          command: tar --extract --bzip2 --file=release-assets-v3.tar.bz2
      - run:
          name: Verify output
          command: ls -la
      - run:
          command: "$PWD/unlink-checker"
  Disconnect-BuilderPath:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/wrk-E
      - run:
          name: Execute patch
          command: |
            mkdir -p /tmp/wrk-E
            { set +o pipefail 2>/dev/null; for thing in seoul osaka helsinki ; do echo "$thing" | rev; done | sort -r; true ; } > /tmp/wrk-E/tCO
            b=$(wc -c </tmp/wrk-E/tCO); echo "produced: $b"; echo "kb: $((b/1024))"
      - persist_to_workspace:
          root: /tmp/wrk-E
          paths:
            - 'tCO'
